[package]
name = "dsp"
version.workspace = true
authors.workspace = true
edition.workspace = true

[dependencies]
wmidi = "4.0.10"
midir = "0.10.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = { workspace = true }
# Ableton Link via official abl_link wrapper. Needs cmake + C++ at build time.
# GPL-2.0-or-later (Ableton Link itself is GPL-2.0).
rusty_link = "0.4"
